name: ptt_client
description: PTT client for Windows and Android, with short URL and web previews.
publish_to: none
version: 0.1.2+3

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  html: ^0.15.6
  dart3_big5: ^0.1.1
  shared_preferences: ^2.5.3
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
